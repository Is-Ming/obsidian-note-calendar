name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"  # 监听所有标签推送

permissions:
  contents: write  # 允许写入内容，用于创建发布版本

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 检出代码
      - name: Checkout Code
        uses: actions/checkout@v3

      # 安装jq（用于解析manifest.json）
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 创建发布版本
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # 从manifest.json获取插件ID
          PLUGIN_ID=$(jq -r '.id' manifest.json)
          # 创建临时目录
          mkdir -p "$PLUGIN_ID"
          # 复制文件到临时目录
          cp main.js manifest.json styles.css "$PLUGIN_ID/"
          # 创建zip包
          zip -r "${PLUGIN_ID}.zip" "$PLUGIN_ID"
          # 创建发布版本，包含原始文件和zip包
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css "${PLUGIN_ID}.zip"
